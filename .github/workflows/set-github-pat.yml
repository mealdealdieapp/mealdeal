name: GitHub PAT für Supabase setzen

# Einmalig auszuführen nach Setup: Speichert den GitHub Personal Access Token
# als Datenbank-Setting in Supabase, damit der Trigger GitHub API aufrufen kann.
#
# Voraussetzungen:
#   - Secret GH_PAT_FOR_SUPABASE muss in GitHub Secrets gesetzt sein
#   - Secret SUPABASE_DB_URL muss gesetzt sein
#   - setup-ondemand-trigger.sql muss bereits ausgeführt worden sein

on:
  workflow_dispatch:

jobs:
  set-pat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Set GitHub PAT as DB Setting
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GH_PAT: ${{ secrets.GH_PAT_FOR_SUPABASE }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "❌ Secret SUPABASE_DB_URL ist nicht gesetzt"
            exit 1
          fi

          if [ -z "$GH_PAT" ]; then
            echo "❌ Secret GH_PAT_FOR_SUPABASE ist nicht gesetzt"
            echo "   Setze es unter: Settings → Secrets and variables → Actions"
            exit 1
          fi

          echo "🔐 Speichere GitHub PAT in app_config Tabelle..."

          # Escape single quotes in PAT (Postgres string escaping)
          ESCAPED_PAT=$(printf '%s' "$GH_PAT" | sed "s/'/''/g")

          # UPSERT in app_config (GitHub maskiert Secrets automatisch in Logs)
          psql "$DB_URL" \
            --set ON_ERROR_STOP=1 \
            -c "INSERT INTO public.app_config (key, value, updated_at) VALUES ('github_pat', '$ESCAPED_PAT', NOW()) ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value, updated_at = NOW();"

          echo ""
          echo "✅ GitHub PAT erfolgreich in app_config Tabelle gespeichert"

      - name: Verify Setting
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "🔍 Prüfe ob PAT gespeichert ist..."
          RESULT=$(psql "$DB_URL" -t -c "SELECT CASE WHEN value IS NOT NULL AND value <> '' THEN 'OK (' || LENGTH(value) || ' Zeichen)' ELSE 'NOT SET' END FROM public.app_config WHERE key = 'github_pat';")
          echo "Status:$RESULT"
