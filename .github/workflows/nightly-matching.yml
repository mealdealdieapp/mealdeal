name: Nightly Matching

# Berechnet jede Nacht die Top-Matches zwischen Zutaten und Produkten neu.
# Läuft nach dem Nightly-Health-Check.

on:
  schedule:
    - cron: '0 4 * * *' # täglich 04:00 UTC (06:00 Berlin im Sommer / 05:00 im Winter)
  workflow_dispatch:
    inputs:
      top_k:
        description: 'Top-K Produkte pro Zutat (default 5)'
        required: false
        default: '5'
      min_score:
        description: 'Min Cosine-Similarity 0.0-1.0 (default 0.6)'
        required: false
        default: '0.6'
      max_ingredients:
        description: 'Max Zutaten pro Run (default 5000)'
        required: false
        default: '5000'
      dry_run:
        description: 'Dry-Run (nichts schreiben)'
        required: false
        default: 'false'

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Run Match Computation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MATCH_TOP_K: ${{ github.event.inputs.top_k || '5' }}
          MATCH_MIN_SCORE: ${{ github.event.inputs.min_score || '0.6' }}
          MATCH_MAX_INGREDIENTS: ${{ github.event.inputs.max_ingredients || '5000' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: node scripts/compute-product-ingredient-matches.mjs

      - name: Notify Telegram on Success
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=🔗 <b>Match-Computation erfolgreich</b>%0A%0AMatches zwischen Zutaten und Produkten wurden aktualisiert.%0A%0A<a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Logs ansehen</a>"

      - name: Notify Telegram on Failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=⚠️ <b>Match-Computation FEHLGESCHLAGEN</b>%0A%0ABitte Logs prüfen.%0A%0A<a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Logs ansehen</a>"
