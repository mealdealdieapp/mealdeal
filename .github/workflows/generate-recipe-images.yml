name: Rezeptbilder generieren (DALL-E)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modus: broken-only (Standard), all, oder ids (bestimmte Rezepte)'
        required: false
        type: choice
        options:
          - broken-only
          - all
          - ids
        default: broken-only
      recipe_ids:
        description: 'Komma-getrennte Rezept-IDs (nur bei Modus "ids")'
        required: false
        type: string

jobs:
  generate-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Generate Recipe Images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "all" ]; then
            node scripts/generate-recipe-images.mjs --all
          elif [ "${{ github.event.inputs.mode }}" = "ids" ]; then
            node scripts/generate-recipe-images.mjs --ids "${{ github.event.inputs.recipe_ids }}"
          else
            node scripts/generate-recipe-images.mjs --broken-only
          fi

      - name: Notify Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MSG="🎨 <b>Rezeptbilder generiert!</b>%0A%0AModus: ${{ github.event.inputs.mode || 'broken-only' }}%0A%0A<a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Logs ansehen</a>"
          else
            MSG="⚠️ <b>Rezeptbild-Generierung fehlgeschlagen</b>%0A%0A<a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Logs ansehen</a>"
          fi
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MSG}"
