name: Push-Dispatcher

# Sendet Web-Push-Benachrichtigungen.
#
# Auto-Schedules:
#   - Wochenplan-Reminder: Sonntag 18:00 Europe/Berlin -> 17:00 UTC (Winter)
#     Wir senden bewusst zu beiden Zeitfenstern (Winter/Sommer-Zeit), die
#     dedup-tag verhindert doppelte Anzeige beim selben User.
#   - Offer-Ending: jeden Tag 17:00 UTC (= 18:00/19:00 lokal)
#
# Manuell:
#   - new_offers_in_plz nach Scrape (repository_dispatch geplant)
#   - marketing via workflow_dispatch mit Inputs

on:
  schedule:
    - cron: '0 17 * * 0'   # Wochenplan-Reminder Sonntag 17:00 UTC
    - cron: '0 17 * * *'   # Offer-ending-soon taeglich 17:00 UTC
    - cron: '0 8 * * *'    # Watchlist-Price-Drop taeglich 08:00 UTC (= 09:00/10:00 Berlin)
  workflow_dispatch:
    inputs:
      trigger:
        description: 'Trigger-Typ'
        required: true
        default: 'weekly_plan_reminder'
        type: choice
        options:
          - weekly_plan_reminder
          - offer_ending_soon
          - new_offers_in_plz
          - watchlist_price_drop
          - marketing
      dry_run:
        description: 'Trockenlauf (kein echter Versand)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      marketing_title:
        description: 'Marketing: Titel (nur bei trigger=marketing)'
        required: false
        type: string
      marketing_body:
        description: 'Marketing: Body (nur bei trigger=marketing)'
        required: false
        type: string
      marketing_url:
        description: 'Marketing: Ziel-URL (nur bei trigger=marketing, z.B. /offers)'
        required: false
        type: string

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Bestimme Trigger anhand des Events
        id: trig
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "trigger=${{ github.event.inputs.trigger }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ github.event.inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            # Schedule: anhand der Cron-Expression entscheiden
            CRON='${{ github.event.schedule }}'
            DOW=$(date -u +%u)
            if [ "$CRON" = "0 8 * * *" ]; then
              echo "trigger=watchlist_price_drop" >> "$GITHUB_OUTPUT"
            elif [ "$DOW" = "7" ] && [ "$CRON" = "0 17 * * 0" ]; then
              echo "trigger=weekly_plan_reminder" >> "$GITHUB_OUTPUT"
            else
              echo "trigger=offer_ending_soon" >> "$GITHUB_OUTPUT"
            fi
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sende Push-Notifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          TRIGGER: ${{ steps.trig.outputs.trigger }}
          DRY_RUN: ${{ steps.trig.outputs.dry_run }}
          MARKETING_TITLE: ${{ github.event.inputs.marketing_title }}
          MARKETING_BODY: ${{ github.event.inputs.marketing_body }}
          MARKETING_URL: ${{ github.event.inputs.marketing_url }}
        run: node scripts/push-dispatcher.mjs

      - name: Telegram-Notify bei Fehler
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" \
              -d "text=Push-Dispatcher Fehler: ${{ steps.trig.outputs.trigger }}"
          fi
