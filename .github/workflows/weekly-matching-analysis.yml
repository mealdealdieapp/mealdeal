name: Wöchentliche Matching-Analyse

# Sonntag 05:00 UTC = 06:00/07:00 MEZ/MESZ
on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:

jobs:
  matching:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Run Matching Analysis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/weekly-matching-analysis.mjs --verbose
