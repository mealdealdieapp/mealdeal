name: AI Product Enrichment

# Zieht bei jedem erfolgreichen Scrape hinterher und enrichet neue Offers mit
# strukturierten Produktdaten (Menge, Kategorie, Marke, Bio, Vegan …).
# Pro Produkt genau ein LLM-Call, danach Caching über products.fingerprint.

on:
  workflow_run:
    workflows:
      - 'Wöchentliches Angebots-Scraping'
      - 'On-Demand PLZ Scrape (Neu-Registrierung)'
    types: [completed]
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Anzahl Offers pro Run (default 200)'
        required: false
        default: '200'
      dry_run:
        description: 'Dry-Run (nichts schreiben, nur loggen)'
        required: false
        default: 'false'

jobs:
  enrich:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Run Enrichment
        id: enrich
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          AI_PROVIDER: gemini
          ENRICH_BATCH: ${{ github.event.inputs.batch_size || '200' }}
          ENRICH_DELAY_MS: '250'
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: node scripts/enrich-products.mjs

      - name: Notify Telegram on Success
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=🧠 <b>AI-Enrichment erfolgreich</b>%0A%0ANeue Offers wurden mit Produktdaten angereichert.%0A%0A<a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Logs ansehen</a>"

      - name: Notify Telegram on Failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=⚠️ <b>AI-Enrichment FEHLGESCHLAGEN</b>%0A%0ABitte Logs prüfen.%0A%0A<a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Logs ansehen</a>"
