name: Wöchentlicher Rezept-Generator

# Sonntag 06:00 UTC = 07:00/08:00 MEZ/MESZ
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      count:
        description: 'Anzahl neuer Rezepte'
        required: false
        default: '5'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Generate Recipes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/weekly-recipe-generator.mjs --count ${{ github.event.inputs.count || '5' }}
