name: Wöchentlicher Rezept-Workflow

# Sonntag 02:00 UTC = 03:00/04:00 MEZ/MESZ (nach dem Samstag-Scrape)
on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      force_generate:
        description: 'Rezept-Generierung erzwingen (auch bei genug Matches)'
        required: false
        type: boolean
        default: false

jobs:
  recipe-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Run Recipe Workflow
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.force_generate }}" = "true" ]; then
            FLAGS="--force-generate"
          fi
          node scripts/weekly-recipe-generator.mjs $FLAGS

      - name: Notify Telegram on Failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=⚠️ <b>Rezept-Workflow Fehler</b>%0A%0ADer wöchentliche Rezept-Workflow ist fehlgeschlagen.%0A%0A<a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Logs ansehen</a>"
